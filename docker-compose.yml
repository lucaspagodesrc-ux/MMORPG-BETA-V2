services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: mmo, POSTGRES_PASSWORD: mmo, POSTGRES_DB: mmo }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mmo"], interval: 3s, retries: 20 }
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://mmo:mmo@db:5432/mmo
      JWT_SECRET: troque-isto-em-producao
    depends_on: { db: { condition: service_healthy } }
volumes:
  pgdata:
